<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/branding/sevenpos-isotype.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SevenPOS conecta punto de venta, inventario, caja y reportes para que controles tu negocio desde un solo lugar." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sevenpos.pro/" />
    <meta property="og:title" content="SevenPOS — Sistema de Punto de Venta para tu negocio" />
    <meta property="og:description" content="Vende mejor. Controla ventas, inventario, caja y resultados en un solo lugar." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sevenpos.pro/" />
    <meta name="twitter:card" content="summary" />
    <title>SevenPOS — Sistema de Punto de Venta para tu negocio</title>
    <script>
      if (location.hostname === 'app.sevenpos.pro' || location.hostname === 'platform.sevenpos.pro') {
        document.querySelector('meta[name="robots"]').content = 'noindex, nofollow';
        document.querySelector('link[rel="canonical"]').remove();
        document.querySelector('meta[property="og:url"]').remove();
        document.title = location.hostname === 'platform.sevenpos.pro' ? 'SevenPOS Platform' : 'SevenPOS App';
      }
    </script>
  </head>
  <body class="bg-background text-text-primary antialiased font-sans selection:bg-brand-primary/20 selection:text-brand-primary min-h-screen">
    <div id="root"></div>
    <div id="sevenpos-print-root" aria-hidden="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
